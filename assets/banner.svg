<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="orbGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="25" result="blur" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.15); }
    }
    @keyframes packetFlow {
      0% { stroke-dashoffset: 240; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px); opacity: 0.3; }
      50% { transform: translateY(-12px); opacity: 0.8; }
    }
    .orb-1 {
      animation: pulseOrb 7s ease-in-out infinite alternate;
      transform-origin: 200px 100px;
    }
    .orb-2 {
      animation: pulseOrb 9s ease-in-out infinite alternate;
      transform-origin: 1000px 300px;
    }
    .stream-line {
      stroke-dasharray: 8 16;
      animation: packetFlow 3s linear infinite;
    }
    .stream-line-rev {
      stroke-dasharray: 10 20;
      animation: packetFlow 4s linear infinite reverse;
    }
    .p1 { animation: floatParticle 4s ease-in-out infinite; }
    .p2 { animation: floatParticle 5s ease-in-out infinite 1s; }
    .p3 { animation: floatParticle 4.5s ease-in-out infinite 2s; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />

  <!-- Grid Pattern -->
  <g opacity="0.08" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="450" y1="0" x2="450" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="750" y1="0" x2="750" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
    <line x1="1050" y1="0" x2="1050" y2="400" />
  </g>

  <!-- Background Ambient Glowing Orbs -->
  <circle class="orb-1" cx="200" cy="100" r="140" fill="#38bdf8" filter="url(#orbGlow)" />
  <circle class="orb-2" cx="1000" cy="300" r="160" fill="#a855f7" filter="url(#orbGlow)" />
  <circle class="orb-1" cx="600" cy="380" r="120" fill="#6366f1" filter="url(#orbGlow)" />

  <!-- Dynamic Event Flow Streams in Background -->
  <g fill="none" opacity="0.6">
    <!-- Top Stream -->
    <path class="stream-line" d="M -50 90 C 250 40, 450 140, 750 70 C 950 20, 1100 100, 1250 80" stroke="#38bdf8" stroke-width="2" />
    <!-- Bottom Stream -->
    <path class="stream-line-rev" d="M -50 310 C 200 360, 500 280, 800 340 C 1000 380, 1150 310, 1250 320" stroke="#818cf8" stroke-width="2" />
    <!-- Diagonal Arc -->
    <path class="stream-line" d="M 100 380 C 300 200, 700 390, 1100 60" stroke="#c084fc" stroke-width="1.5" />
  </g>

  <!-- Floating Signal Nodes -->
  <g class="p1" fill="#38bdf8">
    <circle cx="180" cy="75" r="4" filter="url(#glow)" />
    <circle cx="780" cy="65" r="3" />
  </g>
  <g class="p2" fill="#818cf8">
    <circle cx="980" cy="330" r="5" filter="url(#glow)" />
    <circle cx="260" cy="340" r="3.5" />
  </g>
  <g class="p3" fill="#c084fc">
    <circle cx="1050" cy="90" r="4" filter="url(#glow)" />
    <circle cx="480" cy="310" r="3" />
  </g>

  <!-- FOREGROUND CONTENT: Header, Title, Subtitle, Feature Badges -->
  <g text-anchor="middle">
    <!-- Category Pill -->
    <rect x="460" y="48" width="280" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
    <text x="600" y="69" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5">⚡ AWESOME API &amp; WEBHOOKS</text>

    <!-- Main Title (Guaranteed Foreground) -->
    <text x="600" y="145" fill="url(#accentGrad1)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#glow)">Awesome API Event Webhooks</text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="195" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" letter-spacing="0.2">Production-Grade Infrastructure, Gateways &amp; Event-Driven Architecture</text>

    <text x="600" y="230" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14">Curated directory of high-throughput webhook delivery engines, testing suites &amp; iPaaS platforms</text>

    <!-- Feature Badges Row -->
    <g transform="translate(240, 275)">
      <!-- Badge 1: Webhook Delivery -->
      <g transform="translate(0, 0)">
        <rect width="165" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="22" cy="19" r="6" fill="#38bdf8" />
        <text x="92" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Reliable Delivery</text>
      </g>

      <!-- Badge 2: Outbound Gateways -->
      <g transform="translate(185, 0)">
        <rect width="170" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="22" cy="19" r="6" fill="#818cf8" />
        <text x="96" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Event Gateways</text>
      </g>

      <!-- Badge 3: Inspection & Testing -->
      <g transform="translate(375, 0)">
        <rect width="165" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="22" cy="19" r="6" fill="#c084fc" />
        <text x="94" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Testing &amp; Debug</text>
      </g>

      <!-- Badge 4: Open-Source First -->
      <g transform="translate(560, 0)">
        <rect width="160" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="22" cy="19" r="6" fill="#34d399" />
        <text x="92" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Open-Source Core</text>
      </g>
    </g>

    <!-- Footer meta -->
    <text x="600" y="360" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" letter-spacing="1">UPDATED FOR MODERN EVENT-DRIVEN &amp; SERVERLESS ECOSYSTEMS</text>
  </g>
</svg>
